# 「DBA 模式」的组装 —— 只装这一版实现的那条路径需要的东西。
#
# 这个 agent 要做的事只有一件：拿到一条 SQL，取证，读计划，给建议。
# 于是组装里只有四样：persona、agent instructions、技能加载器、问用户。
# 每多一行都是模型多一个可以走偏的方向，也多一份要维护的表面。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是一个 SQL 优化 Agent，运行在 {{model}} 模型上。
      你的结论一律来自从服务器取到的执行计划与表统计信息，绝不只凭一条语句的样子下判断。
      你只读：给出改写与索引建议并说明代价，由运维自己执行。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── no shell, no filesystem, no delegation ──────────────────────────────────
#
# 没有 shell 是这个包最要紧的决定：握着 `bash` 的 agent 可以绕开工具直连数据库
# （`mysql -e "DROP …"`），那样 src/core/mysql.ts 里的只读策略就只是个说法。
#
# 没有文件系统工具：要优化的语句由用户贴进来，读仓库不在这一版的范围内。
# 没有子 agent：只有一个领域，委派给自己没有意义——等「参数调整」那类真正实现了，
# 再加对应的 tool-subagent 行。
#
# 代价是实打实的：这个 agent 不能 tail 慢日志、不能读 my.cnf、不能跑 mysqldump、
# 不能从工作区里翻出那条 SQL。每一项都该是一个刻意添加的工具。

# ── skills ──────────────────────────────────────────────────────────────────
#
# `tool-skill` 给这个 agent 技能目录与加载器。目录是合并的：`dsh-dba-agent`
# bundle 在全局层注册的 sql-optimize 就是这样到达这里的，不需要单独一行。

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 问用户 ──────────────────────────────────────────────────────────────────
#
# playbook 第 1 步要求"没有语句就先要语句"，第 2 步要求重查询用 EXPLAIN ANALYZE
# 之前先确认——两处都需要能问。

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── compaction ──────────────────────────────────────────────────────────────
#
# 不是模型可见的工具，是上下文管道：`EXPLAIN FORMAT=JSON` 加几张表的建表语句
# 一次就能吃掉很大一块上下文，没有 pruner 的会话撑不过几轮取证。

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
