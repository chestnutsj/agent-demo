# dsh bundle 补丁：`dsh plugin add` 安装本包后自动套用（无需 --patch）。
# 把 dba-mode 加进名册并设为默认，同时保留出货的 standard / minimal / code / cordis。
#
# 机制：CLI（profile-boot）会在最后强制把 id 为 `agent-presets` 那一行的 roots 覆盖成只有
# 出货目录，无法收窄。所以这里把它 disable，另插一个自己 id 的 roster 行——CLI 不碰它。它的
# roots 同时列「本包安装后的 presets」和「出货 presets」，于是 dba-mode 与 standard 都在名册。

- id: agent-presets
  disabled: true

- insert:
    - id: dba-agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: dba-mode
        includeUserRoot: false
        roots:
          # 本包被 `dsh plugin add` 装到 $DSH_HOME/profiles/node_modules/dsh-dba-agent。
          - path: !!js dshHomePath('profiles', 'node_modules', 'dsh-dba-agent', 'presets')
            trust: system
          # 出货 preset 目录（standard 等）；换机器时用 DSH_SHIPPED_PRESETS 覆盖。
          - path: !!js process.env.DSH_SHIPPED_PRESETS ?? '/usr/local/lib/node_modules/@deepseek-ai/dsh/config/agent-presets'
            trust: system

    # 本包自身作为插件加载（lib/index.js）：注册 /sql-optimizer 命令，并挂上证据门禁。
    #
    # 这里刻意不写 config：门禁查的工具名和 SKILL.md 里点名的工具名必须是同一份，那份
    # 就是 src/config.ts 的 DEFAULTS。toolbox 的 tools/list 确认后改 DEFAULTS，不要在这里
    # 另抄一份——抄了就会出现「提示词说调 A、台账查 B」。真要按部署覆盖时才加 config，
    # 可用键见 src/config.ts 的 Config。
    - id: dba-command
      name: dsh-dba-agent
