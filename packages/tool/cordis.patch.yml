# Layer applied when a profile lists the `dsh-dba-tool` bundle.
#
# Method 3 of 3 — directly-registered Tool.
# Loads this bundle's plugin (lib/index.js), which calls ctx.tools.register()
# to add a native `mysql_query` tool. The handler runs scripts/mysql_query.sh
# in the plugin's OWN process (no separate MCP server) and returns its output.
- insert:
    - id: dba-tool
      name: dsh-dba-tool
      # 单连接配置(全部可选)。优先级:此处配置 > MYSQL_* 环境变量 > 脚本默认值。
      # 留空/注释掉的字段会回落到环境变量,不破坏现有用法。
      config:
        host: 192.168.5.117
        # port: 3306
        # user: root
        # password: ''
        # database: mysql
